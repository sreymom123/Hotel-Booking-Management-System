openapi: 3.0.0
info:
  title: Hotel Booking Management System API
  version: '1.0'
  description: API documentation for the Hotel Booking Management System
servers:
  - url: http://localhost:3000/api
    description: Local server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT